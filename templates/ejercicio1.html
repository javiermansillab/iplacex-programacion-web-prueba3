<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <title>Ejercicio 1</title>
</head>

<body>
        <!-- Contenedor del formulario y sus resultados -->
    <div class="contenedor">
    <h1>Formulario de Notas</h1>

<form method="post">

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" name="nota1"
       min="10" max="70" value="{{ nota1 }}" required>

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" name="nota2"
       min="10" max="70" value="{{ nota2 }}" required>

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" name="nota3"
       min="10" max="70" value="{{ nota3 }}" required> 

    <label for="asistencia">Asistencia (%):</label>
    <input type="number" id="asistencia" name="asistencia"
       min="0" max="100" value="{{ asistencia }}" required>

    <button type="submit">Enviar</button>

</form>

{% if promedio is defined %}
    <p>{{ promedio }}</p>
    <p>{{ estado }}</p>
{% endif %}

    <a href="/">Volver al menú</a>
    </div>
</body>
</html>
